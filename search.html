<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>search — devxkapoor mastery track</title>
<link rel="stylesheet" href="assets/styles.css">
<script src="assets/globals.js"></script>
</head>
<body>

<header class="site-header">
  <a class="brand" href="index.html">devxkapoor<strong>/mastery-track</strong></a>
  <div class="right">
    <nav>
      <a href="index.html">topics</a>
      <a href="recall.html">recall</a>
      <a href="search.html" class="active">search</a>
    </nav>
    <button class="theme-toggle" id="themeToggle"></button>
  </div>
</header>

<div class="wrap">
  <h1>Search elaborations</h1>
  <p class="lede">Full-text search across everything you've written up. Perfect for "wait, where did I cover this" moments during revision.</p>

  <input class="search-box" id="filterBox" placeholder="grep -r 'connection pooling' ..." autofocus>
  <div class="card-list" id="results"></div>
</div>

<footer class="site-footer">devxkapoor-learning · updated as topics ship · built with Claude</footer>

<script>
DK.wireThemeToggle(document.getElementById("themeToggle"));
(async function () {
  const tracker = await DK.loadTracker();
  const resultsEl = document.getElementById("results");
  if (!tracker) { resultsEl.innerHTML = "<p class='empty-note'>error: could not load tracker.json</p>"; return; }

  resultsEl.innerHTML = "<p class='empty-note'>loading elaborations across all topics...</p>";
  const all = await DK.loadAllElaboration(tracker);
  resultsEl.innerHTML = `<p class='empty-note'>start typing to search ${all.length} sections across all topics</p>`;

  function render(filterText) {
    if (!filterText) {
      resultsEl.innerHTML = `<p class='empty-note'>start typing to search ${all.length} sections across all topics</p>`;
      return;
    }
    const q = filterText.toLowerCase();
    const filtered = all.filter(s =>
      (s.title || "").toLowerCase().includes(q) ||
      (s.content || "").toLowerCase().includes(q)
    );
    resultsEl.innerHTML = "";
    if (filtered.length === 0) {
      resultsEl.innerHTML = "<p class='empty-note'>no matches</p>";
      return;
    }
    filtered.forEach(s => {
      const idx = s.content.toLowerCase().indexOf(q);
      const snippetStart = Math.max(0, idx - 80);
      const snippet = (idx >= 0)
        ? "…" + s.content.slice(snippetStart, idx + 200) + "…"
        : s.content.slice(0, 200) + "…";
      const card = document.createElement("a");
      card.className = "el-card";
      card.style.display = "block";
      card.style.textDecoration = "none";
      card.style.color = "inherit";
      card.href = `topics/${s.topic}/pack.html#${s.anchor || ""}`;
      card.innerHTML = `
        <div class="topic-tag">${s.topic.replace(/-/g," ")}</div>
        <div class="q">${s.title}</div>
        <div class="a" style="display:block;">${snippet}</div>
      `;
      resultsEl.appendChild(card);
    });
  }

  document.getElementById("filterBox").addEventListener("input", e => render(e.target.value));
})();
</script>

</body>
</html>
