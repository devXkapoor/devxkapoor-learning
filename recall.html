<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>recall — devxkapoor mastery track</title>
<link rel="stylesheet" href="assets/styles.css?v=2407b8bffd">
<script src="assets/globals.js?v=477022acbe"></script>
</head>
<body>

<header class="site-header">
  <a class="brand" href="index.html">devxkapoor<strong>/mastery-track</strong></a>
  <div class="right">
    <nav>
      <a href="index.html">topics</a>
      <a href="recall.html" class="active">recall</a>
      <a href="search.html">search</a>
    </nav>
    <button class="theme-toggle" id="themeToggle"></button>
  </div>
</header>

<div class="wrap">
  <h1>Global recall deck</h1>
  <p class="lede">Every question you've earned, from every topic, all in one place. Click a card to test yourself before peeking at the answer.</p>

  <div class="boot-progress" id="stats"></div>
  <input class="search-box" id="filterBox" placeholder="grep by topic or keyword...">
  <div class="card-list" id="cards"></div>
</div>

<footer class="site-footer">devxkapoor-learning · updated as topics ship · built with Claude</footer>

<script>
DK.wireThemeToggle(document.getElementById("themeToggle"));
(async function () {
  const tracker = await DK.loadTracker();
  const cardsEl = document.getElementById("cards");
  const statsEl = document.getElementById("stats");
  if (!tracker) { cardsEl.innerHTML = "<p class='empty-note'>error: could not load tracker.json</p>"; return; }

  cardsEl.innerHTML = "<p class='empty-note'>loading recall decks across all topics...</p>";
  const all = await DK.loadAllRecall(tracker);

  statsEl.innerHTML = `<div class="counts"><span><span class="n">${all.length}</span> total recall questions</span></div>`;

  const deck = DK.renderDeck(cardsEl, all, { bank: "recall", showTopic: true });
  document.getElementById("filterBox").addEventListener("input", e => deck.setTextFilter(e.target.value));
})();
</script>

</body>
</html>
