<!DOCTYPE html>
<!--
  TOPIC PACK TEMPLATE — filled by the topic-mastery skill per topic.
  Placeholders to replace: {{TOPIC_SLUG}} {{TOPIC_LABEL}} {{TOPIC_TAGLINE}}
  {{LANDSCAPE_HTML}} — the landscape content, hand-authored HTML (prose + <h3> subsections)
  This file is copied to topics/<slug>/pack.html. recall.json, prep.json, and
  elaboration.json live alongside it and are fetched at runtime — do not inline
  that data here.

  Tabs: Landscape (this file) | Recall (topics/<slug>/recall.json, teaching deck,
  ordered by landscape node) | Prep (topics/<slug>/prep.json, interview/scenario
  bank) | Elaboration (topics/<slug>/elaboration.json, deep-dive write-ups).
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TOPIC_LABEL}} — devxkapoor mastery track</title>
<link rel="stylesheet" href="../../assets/styles.css?v=1b906b948f">
<script src="../../assets/globals.js?v=5b1cbbb0dc"></script>
</head>
<body>

<header class="site-header">
  <a class="brand" href="../../index.html">devxkapoor<strong>/mastery-track</strong></a>
  <div class="right">
    <nav>
      <a href="../../index.html">topics</a>
      <a href="../../recall.html">recall</a>
      <a href="../../search.html">search</a>
    </nav>
    <button class="theme-toggle" id="themeToggle"></button>
  </div>
</header>

<div class="wrap">
  <h1>{{TOPIC_LABEL}}</h1>
  <p class="lede">{{TOPIC_TAGLINE}}</p>

  <div class="tabs">
    <button class="tab-btn active" data-tab="landscape">Landscape</button>
    <button class="tab-btn" data-tab="recall">Recall</button>
    <button class="tab-btn" data-tab="prep">Prep</button>
    <button class="tab-btn" data-tab="elaboration">Elaboration</button>
  </div>

  <div id="tab-landscape">
    <div class="prose">
      {{LANDSCAPE_HTML}}
    </div>
  </div>

  <div id="tab-recall" style="display:none">
    <div class="card-list" id="recallCards"></div>
  </div>

  <div id="tab-prep" style="display:none">
    <div class="card-list" id="prepCards"></div>
  </div>

  <div id="tab-elaboration" style="display:none">
    <div class="card-list" id="elabCards"></div>
  </div>
</div>

<footer class="site-footer">devxkapoor-learning · {{TOPIC_SLUG}} · built with Claude</footer>

<script>
DK.wireThemeToggle(document.getElementById("themeToggle"));

const TABS = ["landscape", "recall", "prep", "elaboration"];

document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    TABS.forEach(t => {
      document.getElementById("tab-" + t).style.display = (t === btn.dataset.tab) ? "block" : "none";
    });
  });
});

// Landscape: split the flat prose into collapsible nodes, closed by default,
// so 19 nodes read as a navigable list instead of one continuous wall.
(function () {
  const prose = document.querySelector("#tab-landscape .prose");
  if (!prose) return;
  const n = DK.makeSectionsCollapsible(prose, { startOpen: false });
  DK.addCopyButtons(prose);
  DK.decorateBlocks(prose);
  if (n) DK.addExpandControls(document.getElementById("tab-landscape"), prose, n + " nodes");
})();

// If the URL has a #anchor (e.g. from search.html), jump straight to the elaboration tab.
if (window.location.hash) {
  document.querySelector('.tab-btn[data-tab="elaboration"]').click();
}

function renderCards(container, cards, bank) {
  DK.renderDeck(container, cards, { bank, topic: "{{TOPIC_SLUG}}", showTopic: false });
}

(async function () {
  const recall = await DK.fetchJSON("topics/{{TOPIC_SLUG}}/recall.json");
  const recallEl = document.getElementById("recallCards");
  if (recall && recall.cards && recall.cards.length) {
    renderCards(recallEl, recall.cards, "recall");
  } else {
    recallEl.innerHTML = "<p class='empty-note'>Recall questions land here once this topic's build gets underway.</p>";
  }

  const prep = await DK.fetchJSON("topics/{{TOPIC_SLUG}}/prep.json");
  const prepEl = document.getElementById("prepCards");
  if (prep && prep.cards && prep.cards.length) {
    renderCards(prepEl, prep.cards, "prep");
  } else {
    prepEl.innerHTML = "<p class='empty-note'>Interview and scenario prep lands here once this topic's build gets underway.</p>";
  }

  const elab = await DK.fetchJSON("topics/{{TOPIC_SLUG}}/elaboration.json");
  const elabEl = document.getElementById("elabCards");
  if (elab && elab.sections && elab.sections.length) {
    elab.sections.forEach(s => {
      const block = document.createElement("details");
      block.className = "el-block";
      block.id = s.anchor || "";
      block.innerHTML =
        `<summary class="node-summary">` +
          `<span class="node-chevron">${DK.ICON.chevron}</span>` +
          `<span class="node-title">${s.title}</span>` +
        `</summary>` +
        `<div class="node-body"><div class="prose">${s.content}</div></div>`;
      elabEl.appendChild(block);
    });
    elabEl.querySelectorAll(".el-block .prose").forEach(pr => {
      // Sub-sections start closed too: opening a node shouldn't dump its
      // entire subtree on you at once.
      DK.makeSectionsCollapsible(pr, { startOpen: false, level: "sub" });
      DK.addCopyButtons(pr);
    });
    DK.decorateBlocks(elabEl);
    DK.addExpandControls(document.getElementById("tab-elaboration"), elabEl,
      elab.sections.length + " sections");
    DK.revealHash();
  } else {
    elabEl.innerHTML = "<p class='empty-note'>The deep-dive write-up for this topic hasn't been started yet — it'll fill in section by section as we go.</p>";
  }
})();
</script>

</body>
</html>
