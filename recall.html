<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Recall — devxkapoor Mastery Track</title>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<header class="site-header">
  <strong>devxkapoor — mastery track</strong>
  <nav>
    <a href="index.html">Topics</a>
    <a href="recall.html" class="active">Global Recall</a>
    <a href="search.html">Search</a>
  </nav>
</header>

<div class="wrap">
  <h1>Global Recall Deck</h1>
  <p class="lede">Every question from every topic's recall.json, unioned automatically. Click a card to reveal the answer.</p>

  <div class="stat-row" id="stats"></div>
  <input class="search-box" id="filterBox" placeholder="Filter by topic or keyword…">
  <div class="card-list" id="cards"></div>
</div>

<footer class="site-footer">Updated automatically as topics are pushed. Built with Claude.</footer>

<script src="assets/globals.js"></script>
<script>
(async function () {
  const tracker = await DK.loadTracker();
  const cardsEl = document.getElementById("cards");
  const statsEl = document.getElementById("stats");
  if (!tracker) { cardsEl.innerHTML = "<p>Could not load tracker.json</p>"; return; }

  cardsEl.innerHTML = "<p style='color:var(--text-dim)'>Loading recall decks across all topics…</p>";
  const all = await DK.loadAllRecall(tracker);

  statsEl.innerHTML = `<div class="stat"><strong>${all.length}</strong>Total recall questions</div>`;

  function render(filterText) {
    cardsEl.innerHTML = "";
    const filtered = all.filter(c =>
      !filterText ||
      c.topic.toLowerCase().includes(filterText.toLowerCase()) ||
      (c.q || "").toLowerCase().includes(filterText.toLowerCase())
    );
    if (filtered.length === 0) {
      cardsEl.innerHTML = "<p style='color:var(--text-dim)'>No recall cards yet — push a topic's recall.json to populate this.</p>";
      return;
    }
    filtered.forEach(c => {
      const card = document.createElement("div");
      card.className = "rc-card";
      card.innerHTML = `
        <div class="topic-tag">${c.topic.replace(/-/g," ")}${c.t ? " · " + c.t : ""}</div>
        <div class="q">${c.q}</div>
        <div class="a">${c.a}</div>
      `;
      card.addEventListener("click", () => card.classList.toggle("revealed"));
      cardsEl.appendChild(card);
    });
  }

  render("");
  document.getElementById("filterBox").addEventListener("input", e => render(e.target.value));
})();
</script>

</body>
</html>
